apiVersion: v1
kind: Secret
metadata:
  name: mandmandm-secrets
  namespace: mandmandm
type: Opaque
stringData:
  # Reemplaza con endpoints reales antes de aplicar.
  MONGO_URI: "mongodb://mongo.default.svc.cluster.local:27017"
  REDIS_URI: "redis://redis.default.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql+psycopg://user:password@postgres.default.svc.cluster.local:5432/mandmandm"
