apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandmandm-frontend
  namespace: mandmandm
  labels:
    app: mandmandm-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mandmandm-frontend
  template:
    metadata:
      labels:
        app: mandmandm-frontend
    spec:
      containers:
        - name: frontend
          image: quinterorendon/mandmandm-front:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mandmandm-config
          readinessProbe:
            httpGet:
              path: /static/config.js
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /static/config.js
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
